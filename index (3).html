<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6fa8">
  <title>Happy Birthday 💖</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
      color: #5b2345;
      background:
        radial-gradient(circle at top left, #fff4fa 0, transparent 35%),
        radial-gradient(circle at bottom right, #ffe2ef 0, transparent 40%),
        linear-gradient(135deg, #fff8fc, #ffeaf4);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      position: relative;
    }

    .card {
      width: min(100%, 480px);
      text-align: center;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 28px;
      padding: 24px 18px 28px;
      box-shadow: 0 18px 55px rgba(154, 63, 108, .18);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 2;
    }

    .emoji {
      font-size: 38px;
      animation: bounce 1.7s ease-in-out infinite;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(2.1rem, 10vw, 3.7rem);
      line-height: 1;
      color: #ed4f91;
    }

    .name {
      font-size: clamp(1.3rem, 6vw, 2rem);
      font-weight: 700;
      margin: 10px 0 18px;
    }

    .photo-wrap {
      width: min(100%, 340px);
      aspect-ratio: 4 / 5;
      margin: 0 auto 20px;
      padding: 6px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ff8fba, #c78bff, #ffd36e);
      box-shadow: 0 12px 30px rgba(190, 77, 135, .22);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 19px;
      background: #f7dce8;
    }

    .message {
      font-size: 1.05rem;
      line-height: 1.65;
      margin: 0 auto 20px;
      max-width: 390px;
    }

    .wish {
      font-size: 1.12rem;
      font-weight: 700;
      color: #d83c80;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 23px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #ff5f9e, #b96cff);
      box-shadow: 0 8px 20px rgba(210, 73, 139, .25);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.97); }

    .hint {
      margin-top: 13px;
      font-size: .82rem;
      color: #9a6680;
    }

    .confetti {
      position: fixed;
      top: -12px;
      width: 8px;
      height: 14px;
      z-index: 5;
      pointer-events: none;
      animation: fall linear forwards;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      z-index: 1;
      pointer-events: none;
      opacity: .65;
      animation: floatUp linear forwards;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, var(--rotate));
        opacity: 0;
      }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    @media (max-width: 380px) {
      .card { padding: 20px 14px 24px; border-radius: 23px; }
      .message { font-size: 1rem; }
      .photo-wrap { border-radius: 20px; }
    }
  </style>
</head>

      <p class="message">
        Wishing you a beautiful birthday filled with happiness, smiles,
        unforgettable moments and all the love you deserve. 💖
      </p>

      <div class="wish">
        May all your dreams come true! 🌸
      </div>

      <button onclick="celebrate()">🎉 Celebrate!</button>
      <div class="hint">Tap the button for more confetti ✨</div>

  <script>
    function makeConfetti(amount = 90) {
      const pieces = ["#ff5f9e", "#ffd166", "#7bdff2", "#b96cff", "#7bd88f", "#ff8f70"];

      for (let i = 0; i < amount; i++) {
        const c = document.createElement("span");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = pieces[Math.floor(Math.random() * pieces.length)];
        c.style.animationDuration = (2.5 + Math.random() * 3.5) + "s";
        c.style.animationDelay = (Math.random() * .8) + "s";
        c.style.setProperty("--drift", (Math.random() * 240 - 120) + "px");
        c.style.setProperty("--rotate", (Math.random() * 720 - 360) + "deg");
        c.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7000);
      }
    }

    function makeHearts(amount = 14) {
      for (let i = 0; i < amount; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = Math.random() > .5 ? "💖" : "✨";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (14 + Math.random() * 18) + "px";
        h.style.animationDuration = (5 + Math.random() * 5) + "s";
        h.style.animationDelay = (Math.random() * 2) + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 10000);
      }
    }

    function celebrate() {
      makeConfetti(140);
      makeHearts(20);
    }

    // Small automatic celebration when the page opens.
    window.addEventListener("load", () => {
      makeConfetti(70);
      makeHearts(12);
    });
  </script>
